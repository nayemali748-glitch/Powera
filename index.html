<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script>
      window.addEventListener('error', function (e) {
        if (!e) return;
        var msg = String(e.message || '');
        if (msg === 'Script error.' || msg === 'Script error' || msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('Login error') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (!e) return;
        var r = String(e.reason || '');
        if (r.indexOf('WebSocket') !== -1 || r.indexOf('[vite]') !== -1 || r.indexOf('Login error') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
    <title>POWER</title>
